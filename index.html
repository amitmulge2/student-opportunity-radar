<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Opportunity Radar</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#182334;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:220px 1fr}aside{background:#182334;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:8px}.brand{font-size:19px;font-weight:700;margin-bottom:25px}.brand small{display:block;color:#97b2ff;font-size:10px;letter-spacing:2px;margin:4px 0 0 27px}.nav{border:0;background:none;color:white;text-align:left;padding:12px;border-radius:8px;font:inherit;cursor:pointer}.nav.active,.nav:hover{background:#354662}main{padding:32px clamp(18px,4vw,52px)}h1{font-size:28px;margin:0}.sub{color:#697689;margin:8px 0 24px}.toolbar{display:flex;gap:10px}.search,select{height:42px;border:1px solid #e4e9f0;border-radius:8px;background:white;padding:0 12px;font:inherit}.search{flex:1}.match,.count{color:#697689}.match{display:block;margin:14px 0}.count{font-size:12px;margin:16px 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid #e4e9f0;border-radius:11px;padding:17px;min-height:185px;display:flex;flex-direction:column;gap:14px}.top,.tags,.actions{display:flex;align-items:center;gap:10px}.top{justify-content:flex-start}.icon{background:#ecf2ff;color:#3669e6;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;font-size:20px}.org,.meta,.status{color:#697689;font-size:12px}.title{font-size:15px;font-weight:700;margin-top:4px}.save{margin-left:auto;color:#dc4e60;background:none;border:0;font-size:22px;cursor:pointer}.bottom{margin-top:auto}.tags,.actions{justify-content:space-between}.deadline{color:#ad6622;font-size:12px;font-weight:650}.good{color:#268e69;font-size:11px}.actions{border-top:1px solid #edf0f4;margin-top:10px;padding-top:10px}.track{background:#eff4ff;color:#3669e6;border:0;border-radius:7px;padding:9px 12px;font-weight:650;cursor:pointer}.empty{grid-column:1/-1;text-align:center;background:white;border-radius:10px;padding:40px;color:#697689}footer{margin-top:20px;color:#8b96a6;font-size:11px}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;padding:12px}.brand{grid-column:1/-1;margin:0}main{padding:22px 14px}.cards{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}h1{font-size:24px}}
</style></head><body><div class="layout"><aside><div class="brand">✦ Opportunity<small>RADAR</small></div><button class="nav active" data-page="Explore">⌕ Explore</button><button class="nav" data-page="Saved opportunities">♡ Saved opportunities</button><button class="nav" data-page="My applications">▤ My applications</button></aside><main><h1>Find your next opportunity</h1><p class="sub">A smarter way to discover what’s next in your career.</p><div class="toolbar"><input id="search" class="search" placeholder="Search roles, skills, companies..."><select id="category"><option>All opportunities</option><option>Internships</option><option>Hackathons</option><option>Workshops</option><option>Competitions</option><option>Scholarships</option><option>Placements</option></select></div><label class="match"><input id="eligible" type="checkbox"> Only show matches for me</label><div id="count" class="count"></div><section id="cards" class="cards"></section><footer>Sample demo opportunities. Saved items and statuses stay in this browser.</footer></main></div><script>
var data=[['1','Software Engineering Intern','Google','Internships','Paid · 12 weeks','Bengaluru','Nov 12, 2026','Java, Python',1],['2','Product Design Intern','Adobe','Internships','Paid · 10 weeks','Noida','Nov 18, 2026','Figma, UX',0],['3','Build for Tomorrow','Devfolio','Hackathons','₹2,00,000 prize','Online','Nov 08, 2026','AI, Java',1],['4','Cloud & AI Bootcamp','AWS Student Community','Workshops','Free · Certificate','Online','Nov 15, 2026','Cloud, Python',1],['5','Smart India Hackathon','Government of India','Competitions','National · Team event','India','Nov 20, 2026','Java, IoT',1],['6','Parivartan Scholarship','HDFC Bank','Scholarships','Up to ₹75,000','India','Dec 05, 2026','Undergraduate',1],['7','Graduate Engineer Trainee','TCS','Placements','Full-time · 6–9 LPA','India','Nov 28, 2026','Java, SQL',1]];var saved=JSON.parse(localStorage.getItem('radar-saved')||'[]'),status=JSON.parse(localStorage.getItem('radar-status')||'{}'),page='Explore';
function draw(){var q=document.getElementById('search').value.toLowerCase(),cat=document.getElementById('category').value,only=document.getElementById('eligible').checked,items=data.filter(function(o){return(page!=='Saved opportunities'||saved.includes(o[0]))&&(page!=='My applications'||status[o[0]])&&(page!=='Explore'||cat==='All opportunities'||o[3]===cat)&&(!only||o[8])&&o.join(' ').toLowerCase().includes(q)}),root=document.getElementById('cards');document.getElementById('count').textContent=items.length+' opportunities';root.innerHTML='';if(!items.length){root.innerHTML='<div class="empty">No opportunities found. Try another filter.</div>';return}items.forEach(function(o){var c=document.createElement('article');c.className='card';var top=document.createElement('div');top.className='top';top.innerHTML='<div class="icon">◎</div><div><div class="org"></div><div class="title"></div></div>';top.children[1].children[0].textContent=o[2];top.children[1].children[1].textContent=o[1];var save=document.createElement('button');save.className='save';save.textContent=saved.includes(o[0])?'♥':'♡';save.onclick=function(){var n=saved.indexOf(o[0]);n<0?saved.push(o[0]):saved.splice(n,1);localStorage.setItem('radar-saved',JSON.stringify(saved));draw()};top.appendChild(save);c.appendChild(top);var m=document.createElement('div');m.className='meta';m.textContent=o[4]+' · '+o[5];c.appendChild(m);var b=document.createElement('div');b.className='bottom';b.innerHTML='<div class="tags"><span class="deadline"></span><span class="good"></span></div><div class="actions"><span class="status"></span><button class="track"></button></div>';b.querySelector('.deadline').textContent='Deadline '+o[6];b.querySelector('.good').textContent=o[8]?'✓ Good match':'Open to all';b.querySelector('.status').textContent=status[o[0]]||'Not applied';var track=b.querySelector('.track');track.textContent=status[o[0]]?'Update status':'Track application';track.onclick=function(){var v=prompt('Enter status: Interested, Applied, Interviewing, Offer received, Not applied',status[o[0]]||'Interested');if(v===null)return;if(v==='Not applied')delete status[o[0]];else status[o[0]]=v;localStorage.setItem('radar-status',JSON.stringify(status));draw()};c.appendChild(b);root.appendChild(c)})}document.querySelectorAll('.nav').forEach(function(b){b.onclick=function(){page=b.dataset.page;document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active',x===b)});draw()}});document.getElementById('search').oninput=draw;document.getElementById('category').onchange=draw;document.getElementById('eligible').onchange=draw;draw();
</script></body></html>
